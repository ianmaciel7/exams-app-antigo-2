name: E2E Enhanced PDF Reader
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/reader-enhanced-text.test.mjs'
      - 'tests/reader-enhanced-text.e2e.mjs'
      - '.github/workflows/e2e-reader-enhanced-text.yml'
permissions:
  contents: write
jobs:
  reader-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/reader-enhanced-text.test.mjs
  browser-two-column:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and PDF generation fixture
        run: |
          npm install --no-save playwright pdf-lib
          npx playwright install --with-deps chromium
      - name: Start local prototype
        run: |
          python3 -m http.server 8765 --directory prototypes >/tmp/pdf-reflow.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pdf-reflow.log
          exit 1
      - name: Test PDF.js two-column text extraction and keyboard actions in Chromium
        run: node tests/reader-enhanced-text.e2e.mjs
      - name: Version real PDF screenshots into the board exactly once
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-77-luna-20261115' && github.event.pull_request.head.repo.full_name == github.repository && success() }}
        run: |
          python3 scripts/append-issue77-reader-board.py
          npm run board
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/board-exam-app/board.json prototypes/board-exam-app/BOARD.md
          git add prototypes/board-exam-app/issue77_reader_e2e.json
          git add prototypes/board-exam-app/assets/issue77_reader_*.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs(board): version issue 77 verified Chromium screenshots'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Upload reader screenshots and test journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue77-reader-e2e-evidence
          path: |
            prototypes/board-exam-app/assets/issue77_*.png
            prototypes/board-exam-app/issue77_reader_e2e.json
          if-no-files-found: warn
