name: E2E Editorial Study Home
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/editorial-home.e2e.mjs'
      - '.github/workflows/e2e-editorial-home.yml'
  push:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/editorial-home.e2e.mjs'
      - '.github/workflows/e2e-editorial-home.yml'

permissions:
  contents: read
jobs:
  editorial-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local prototype
        run: |
          python3 -m http.server 8765 --directory prototypes >/tmp/home-editorial.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-editorial.log
          exit 1
      - name: Validate live metrics and four-tab keyboard UX
        run: node tests/editorial-home.e2e.mjs
      - name: Save screenshots and assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issues58-69-editorial-home-evidence
          path: |
            prototypes/board-exam-app/assets/issue58_69_*.png
            prototypes/board-exam-app/issues58_69_home_e2e.json
          if-no-files-found: warn
