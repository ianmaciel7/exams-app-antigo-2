name: Regenerate flattened prototype indexes

on:
  push:
    branches:
      - feat/flatten-prototypes-phase1
    paths:
      - .github/workflows/flatten-regenerate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flatten-prototypes-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration script syntax
        run: |
          python3 -m py_compile scripts/build-evidence-catalog.py scripts/check-docs-migration.py scripts/validate-docs-architecture.py scripts/validate-evidence-catalog.py prototypes/build_feature_links.py prototypes/validate_feature_links.py
          node --check scripts/render-mermaid-check.mjs
      - name: Regenerate derived board and evidence data
        run: |
          python3 scripts/build-evidence-catalog.py
          python3 prototypes/build_feature_links.py
          python3 prototypes/render_board_mestre.py
          python3 prototypes/board_to_md.py
      - name: Refresh recorded destination SHA256 in migration map
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          p = pathlib.Path('prototypes/MIGRATION-MAP.md')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          pattern = re.compile(r'^(\| \x60[^\x60]+\x60 \| \x60([^\x60]+)\x60 \| \x60(?:[0-9a-f]+|—)\x60 \| \x60)([0-9a-f]{16})(\x60 \|.*)$')
          changes = 0
          output = []
          for line in lines:
              m = pattern.match(line)
              if m:
                  f = pathlib.Path(m.group(2))
                  if not f.is_file():
                      raise SystemExit(f'missing destination: {f}')
                  actual = hashlib.sha256(f.read_bytes()).hexdigest()[:16]
                  if actual != m.group(3):
                      changes += 1
                  line = m.group(1) + actual + m.group(4)
              output.append(line)
          p.write_text(''.join(output), encoding='utf-8')
          print(f'Migration map refreshed: {changes} destination hashes')
          PY
      - name: Commit generated files back to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/catalog.json prototypes/CATALOG.md prototypes/gallery.html prototypes/feature-links.json prototypes/board-mestre.md prototypes/BOARD.md prototypes/MIGRATION-MAP.md
          git add -A -- 'prototypes/inline-e*' || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(flatten): regenerate board evidence and migration checksums"
            git push origin HEAD:feat/flatten-prototypes-phase1
          fi
      - name: Check migrated artifact integrity
        shell: bash
        run: |
          python3 scripts/check-docs-migration.py
          python3 scripts/validate-docs-architecture.py
          python3 scripts/validate-evidence-catalog.py
          python3 prototypes/validate_board.py
          python3 prototypes/validate_board_index.py
          python3 prototypes/validate_feature_links.py
