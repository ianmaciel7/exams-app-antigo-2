name: Validate evidence catalog

on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/docs/evidence/**'
      - 'scripts/build-evidence-catalog.py'
      - 'scripts/validate-evidence-catalog.py'
      - '.github/workflows/validate-evidence-catalog.yml'
  push:
    branches: [dev]
    paths:
      - 'prototypes/docs/evidence/**'
      - 'scripts/build-evidence-catalog.py'
      - 'scripts/validate-evidence-catalog.py'
      - '.github/workflows/validate-evidence-catalog.yml'

permissions:
  contents: read

jobs:
  evidence-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog against the repository
        run: python3 scripts/validate-evidence-catalog.py
