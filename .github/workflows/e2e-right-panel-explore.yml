name: E2E Contextual Explore and Tools
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/right-panel-explore.e2e.mjs'
      - '.github/workflows/e2e-right-panel-explore.yml'
  push:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/right-panel-explore.e2e.mjs'
      - '.github/workflows/e2e-right-panel-explore.yml'

permissions:
  contents: read

jobs:
  panel-explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real-user journey
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local prototype
        run: |
          python3 -m http.server 8765 --directory prototypes >/tmp/explore.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/explore.log
          exit 1
      - name: Verify six tools, contextual links and keyboard focus
        run: node tests/right-panel-explore.e2e.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue54-contextual-panel-evidence
          path: |
            prototypes/board-exam-app/assets/issue54_*.png
            prototypes/board-exam-app/issue54_explore_e2e.json
          if-no-files-found: warn
