name: E2E Daily Review and Linked Sources
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/ux-route-inventory.test.mjs'
      - 'tests/daily-review.e2e.mjs'
      - '.github/workflows/e2e-daily-review.yml'
  push:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/daily-review.e2e.mjs'
      - '.github/workflows/e2e-daily-review.yml'

permissions:
  contents: write

jobs:
  daily-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test domain helpers and route contracts
        run: node --test tests/ux-route-inventory.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local prototype
        run: |
          python3 -m http.server 8765 --directory prototypes >/tmp/daily-review.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/daily-review.log
          exit 1
      - name: Test QA, cloze, TTS, grading, persistence and direct imports
        run: node tests/daily-review.e2e.mjs
      - name: Record independently tested screenshots in versioned board
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-82-luna-20261115' && github.event.pull_request.head.repo.full_name == github.repository && success() }}
        run: |
          python3 scripts/append-issue82-daily-board.py
          npm run board
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/board-exam-app/board.json prototypes/board-exam-app/BOARD.md
          git add prototypes/board-exam-app/issue82_daily_review_e2e.json
          git add prototypes/board-exam-app/assets/issue82_*.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs(board): preserve issue 82 Chromium proof'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Upload true browser screenshots and journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue82-daily-review-evidence
          path: |
            prototypes/board-exam-app/assets/issue82_*.png
            prototypes/board-exam-app/issue82_daily_review_e2e.json
          if-no-files-found: warn
