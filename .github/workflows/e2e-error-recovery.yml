name: E2E Strict Error Recovery
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/error-recovery.e2e.mjs'
      - '.github/workflows/e2e-error-recovery.yml'
  push:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/error-recovery.e2e.mjs'
      - '.github/workflows/e2e-error-recovery.yml'

permissions:
  contents: write

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local prototype
        run: |
          python3 -m http.server 8765 --directory prototypes >/tmp/error-recovery.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/error-recovery.log
          exit 1
      - name: Validate immutable wrong-to-correct lifecycle, notebook and edital
        run: node tests/error-recovery.e2e.mjs
      - name: Upload browser screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue76-recovery-evidence
          path: |
            prototypes/board-exam-app/assets/issue76_*.png
            prototypes/board-exam-app/issue76_recovery_e2e.json
          if-no-files-found: warn
      - name: Persist independently verified browser evidence into the planning board
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && success() }}
        run: |
          python scripts/append-issue76-recovery-board.py
          npm run board
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/board-exam-app/board.json prototypes/board-exam-app/BOARD.md
          git add prototypes/board-exam-app/issue76_recovery_e2e.json
          git add prototypes/board-exam-app/assets/issue76_*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(board): preserve issue 76 Chromium proof [skip ci]"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
